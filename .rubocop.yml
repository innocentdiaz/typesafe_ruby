AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Style/OptionalBooleanParameter:
  Enabled: false

Layout/LineLength:
  Max: 140

Metrics/AbcSize:
  Max: 30

Metrics/MethodLength:
  Max: 20

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/ParameterLists:
  Max: 6

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - lib/s1/rspec.rb   # the shared conformance examples
    - s1.gemspec

# The noul DSL takes `true:` / `false:` clarification kwargs by design.
Lint/BooleanSymbol:
  Exclude:
    - spec/**/*

Lint/ConstantDefinitionInBlock:
  Exclude:
    - spec/**/*

# Delegators: `**kw` is the whole point.
Naming/MethodParameterName:
  AllowedNames: [kw, id, a, q, e]

# `collapse` returns a boolean by design: it is the named form of the `?` methods.
Naming/PredicateMethod:
  AllowedMethods: [collapse]

Metrics/ClassLength:
  Max: 120
